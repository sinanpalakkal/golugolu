<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gulogu - Useless Search</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #202124;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */

        nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 30px;
            gap: 22px;
            font-size: 13px;
        }

        nav a {
            color: #202124;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main Container */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 110px 15px 50px;
            width: 100%;
        }

        /* Logo */

        .logo {
            font-size: 65px;
            font-weight: 600;
            letter-spacing: -4px;
            margin-bottom: 30px;
        }

        .tagline {
            font-size: 14px;
            color: #70757a;
            margin-top: -20px;
            margin-bottom: 30px;
        }

        /* Search Bar */

        .search-box {
            width: 90%;
            max-width: 580px;
            height: 48px;
            border: 1px solid #dfe1e5;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 0 17px;
            transition: 0.2s;
        }

        .search-box:hover,
        .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: transparent;
        }

        .search-icon {
            color: #9aa0a6;
            font-size: 19px;
            margin-right: 12px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            min-width: 0;
            color: #202124;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .buttons button {
            background: #f8f9fa;
            border: 1px solid #f8f9fa;
            padding: 10px 17px;
            border-radius: 5px;
            color: #3c4043;
            font-size: 14px;
            cursor: pointer;
        }

        .buttons button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        /* Trending Searches */

        .trending-section {
            margin-top: 65px;
            width: 90%;
            max-width: 580px;
            text-align: center;
        }

        .trending-section h3 {
            font-size: 16px;
            font-weight: 500;
            color: #5f6368;
            margin-bottom: 20px;
        }

        .trending-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .trending-list a {
            display: inline-block;
            padding: 10px 16px;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 25px;
            color: #3c4043;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .trending-list a:hover {
            background: #f1f3f4;
            border-color: #aeb4ba;
            transform: translateY(-2px);
        }

        .no-trending {
            color: #9aa0a6;
            font-size: 13px;
        }

        /* Footer */

        footer {
            margin-top: auto;
            width: 100%;
            padding: 18px;
            text-align: center;
            background: #f2f2f2;
            color: #70757a;
            font-size: 13px;
        }

        /* Mobile Responsive */

        @media(max-width: 600px) {

            nav {
                padding: 18px;
            }

            .container {
                padding-top: 130px;
            }

            .logo {
                font-size: 48px;
            }

            .search-box {
                width: 92%;
            }

            .buttons {
                gap: 8px;
            }

            .buttons button {
                padding: 10px 13px;
                font-size: 13px;
            }

            .trending-section {
                margin-top: 55px;
                width: 95%;
            }

            .trending-list {
                gap: 8px;
            }

            .trending-list a {
                font-size: 12px;
                padding: 9px 13px;
            }

        }

    </style>

</head>

<body>

    <!-- Navigation -->

    <nav>
        <nav>
    <a href="{% url 'about' %}">About Us</a>
</nav>
</nav>

    <!-- Main Homepage -->

    <main class="container">

        <!-- Logo -->

        <h1 class="logo">

            <span style="color: #4285F4;">G</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">l</span><span style="color: #4285F4;">u</span><span style="color: #34A853;">g</span><span style="color: #4285F4;">o</span><span style="color: #34A853;">l</span><span style="color: #EA4335;">u</span>

        </h1>


        <p class="tagline">
            Searching is pointless. But go ahead!
        </p>


        <!-- Search Bar -->

        <form class="search-box" action="{% url 'results' %}" method="GET">

            <span class="search-icon">⌕</span>

            <input
                type="text"
                name="q"
                placeholder="Search for absolutely nothing..."
                required
            >

        </form>


        <!-- Search Buttons -->

        <div class="buttons">

            <button onclick="document.querySelector('.search-box').requestSubmit()">

                Useless Search

            </button>

            <button onclick="feelingLucky()">

                I'm Feeling Lucky

            </button>

        </div>


        <!-- Trending Searches -->

        <section class="trending-section">

            <h3>🔥 Trending Searches</h3>

            <div class="trending-list">

                {% for item in trending %}

                    <a href="{% url 'results' %}?q={{ item.display_query|urlencode }}">

                        🔍 {{ item.display_query }}

                    </a>

                {% empty %}

                    <p class="no-trending">
                        No trending searches yet. Be the first to search something ! 😂
                    </p>

                {% endfor %}

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        The Internet's most useless search engine © 2026

    </footer>


    <!-- JavaScript -->

    <script>

        function feelingLucky() {

            const searches = [

                "Why am I single?",
                "How to become rich?",
                "Why is life difficult?",
                "How to sleep faster?",
                "Who am I?",
                "Why am I always hungry?",
                "Can I become a millionaire by sleeping?",
                "Where does my money disappear?"

            ];

            const random = Math.floor(
                Math.random() * searches.length
            );

            window.location.href =
                "{% url 'results' %}?q=" +
                encodeURIComponent(searches[random]);

        }

    </script>

</body>

</html>
